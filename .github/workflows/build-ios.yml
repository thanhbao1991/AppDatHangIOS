name: Build unsigned iOS IPA

# Native SwiftUI (chuyển từ React Native/Expo, xem README) — build unsigned trên macOS runner của
# GitHub. Ký + cài thật làm ở máy Windows bằng Sideloadly, KHÔNG ký trong CI.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests (iOS Simulator)
        run: |
          xcodebuild test \
            -project AppDatHangIOS.xcodeproj \
            -scheme AppDatHangIOS \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO

  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # CFBundleShortVersionString/CFBundleVersion trong project.yml cố định "1.0"/"1" — stamp
      # gitSha+build time để phân biệt bản đang cài, khớp cách AppQuanLyIOS đang làm.
      - name: Stamp build version into Info.plist
        run: |
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          BUILD_TIME=$(date -u +%Y%m%d%H%M%S)
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${SHORT_SHA}" Sources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_TIME}" Sources/Info.plist

      - name: Build unsigned .app
        run: |
          xcodebuild \
            -project AppDatHangIOS.xcodeproj \
            -scheme AppDatHangIOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package unsigned .ipa
        run: |
          set -e
          APP_PATH="build/Build/Products/Release-iphoneos/AppDatHangIOS.app"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r AppDatHangIOS-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: AppDatHangIOS-unsigned-ipa
          path: AppDatHangIOS-unsigned.ipa
