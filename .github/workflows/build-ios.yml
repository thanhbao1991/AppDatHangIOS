name: Build unsigned iOS IPA

# Native SwiftUI (chuyển từ React Native/Expo, xem README) — build unsigned trên macOS runner của
# GitHub. Ký + cài thật làm ở máy Windows bằng Sideloadly, KHÔNG ký trong CI.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        # Bản nộp App Store: KHÔNG nhúng tài khoản test, giữ version dạng số (1.0.0) từ project.yml.
        # Mặc định false = bản sideload nội bộ như cũ.
        description: "Bản nộp App Store (không có nút Test nhanh, version dạng số)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests (iOS Simulator)
        # Không chỉ đích danh model ("iPhone 16") — GitHub âm thầm đổi simulator mặc định trên
        # image macos-15 theo thời gian (2026-09-08 từng gãy CI của AppQuanLyIOS vì "iPhone 16"
        # biến mất khỏi runner). Tự dò 1 simulator iPhone có sẵn (bất kỳ) trên máy.
        run: |
          set -e
          UDID=$(xcrun simctl list devices available \
            | grep -m1 -E 'iPhone [0-9]+ \(' \
            | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          if [ -z "$UDID" ]; then
            echo "Khong tim thay simulator iPhone nao kha dung"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Dung simulator: $UDID"
          xcodebuild test \
            -project AppDatHangIOS.xcodeproj \
            -scheme AppDatHangIOS \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO

  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Chỉ dev/test dùng — danh sách SĐT test (mật khẩu chung "123456") KHÔNG được commit vào repo
      # PUBLIC này (xem LoginView.swift, quickTestAccounts). Bí mật TEST_ACCOUNTS_JSON rỗng/chưa set
      # thì bỏ qua, hàng nút chọn nhanh ở màn Login tự ẩn, không ảnh hưởng build thật.
      # Bản nộp App Store (inputs.release) KHÔNG BAO GIỜ nhúng file này — nếu không, hàng nút "Test
      # nhanh" (đăng nhập thẳng bằng mật khẩu chung) sẽ lọt tới tay khách thật.
      - name: Write local test accounts (from secret, not committed)
        if: ${{ !inputs.release }}
        env:
          TEST_ACCOUNTS_JSON: ${{ secrets.TEST_ACCOUNTS_JSON }}
        run: |
          if [ -n "$TEST_ACCOUNTS_JSON" ]; then
            echo "$TEST_ACCOUNTS_JSON" > Sources/TestAccounts.local.json
          fi

      - name: Guard - release build must not contain test accounts
        if: ${{ inputs.release }}
        run: |
          if [ -f Sources/TestAccounts.local.json ]; then
            echo "TestAccounts.local.json ton tai trong ban release - dung lai"; exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Bản sideload: stamp gitSha+build time vào version để phân biệt bản đang cài (khớp cách
      # AppQuanLyIOS đang làm). Bản App Store: GIỮ CFBundleShortVersionString dạng số từ project.yml
      # (App Store Connect từ chối version chứa chữ), build number = số lần chạy workflow (luôn tăng).
      # gitSha vẫn ghi vào key riêng DennGitSha để tra ngược bản nào đang chạy.
      - name: Stamp build version into Info.plist
        run: |
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          /usr/libexec/PlistBuddy -c "Add :DennGitSha string ${SHORT_SHA}" Sources/Info.plist
          if [ "${{ inputs.release }}" = "true" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Sources/Info.plist
          else
            BUILD_TIME=$(date -u +%Y%m%d%H%M%S)
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${SHORT_SHA}" Sources/Info.plist
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_TIME}" Sources/Info.plist
          fi

      - name: Build unsigned .app
        run: |
          xcodebuild \
            -project AppDatHangIOS.xcodeproj \
            -scheme AppDatHangIOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package unsigned .ipa
        run: |
          set -e
          APP_PATH="build/Build/Products/Release-iphoneos/AppDatHangIOS.app"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r AppDatHangIOS-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: AppDatHangIOS-unsigned-ipa
          path: AppDatHangIOS-unsigned.ipa

  # Ký thật + đẩy lên TestFlight — CHỈ chạy khi bấm workflow_dispatch với release=true. Không chạy
  # trên push thường (tránh tốn build slot App Store Connect + cần secrets ký chỉ nên dùng khi
  # cố ý nộp bản test/release). Cần 6 secrets tạo tay trên Apple Developer Portal/App Store Connect
  # rồi add vào GitHub repo Settings > Secrets: IOS_DIST_CERTIFICATE_BASE64 (base64 của file .p12
  # Distribution cert), IOS_DIST_CERTIFICATE_PASSWORD, IOS_PROVISIONING_PROFILE_BASE64 (base64 của
  # .mobileprovision loại App Store), IOS_PROVISIONING_PROFILE_NAME (đúng tên profile hiện trên
  # Developer Portal), APPLE_TEAM_ID, ASC_API_KEY_ID + ASC_API_ISSUER_ID + ASC_API_KEY_BASE64
  # (base64 file .p8 tạo ở App Store Connect > Users and Access > Integrations > App Store Connect
  # API, role tối thiểu "App Manager").
  testflight:
    if: ${{ inputs.release }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Guard - release build must not contain test accounts
        run: |
          if [ -f Sources/TestAccounts.local.json ]; then
            echo "TestAccounts.local.json ton tai trong ban release - dung lai"; exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Build number = so lan chay workflow (luon tang, khop yeu cau App Store Connect). Version
      # dang so (1.0.0) giu nguyen tu project.yml, KHONG dam gitSha vao day.
      - name: Stamp build number into Info.plist
        run: |
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          /usr/libexec/PlistBuddy -c "Add :DennGitSha string ${SHORT_SHA}" Sources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Sources/Info.plist

      # Theo huong dan chinh thuc cua GitHub cho macOS runner:
      # https://docs.github.com/actions/deployment/deploying-xcode-applications/installing-an-apple-certificate-on-macos-runners-for-xcode-development
      - name: Import signing certificate + provisioning profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -e
          CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"

          echo -n "$CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          mkdir -p ~/Library/MobileDevice/"Provisioning Profiles"
          cp "$PROFILE_PATH" ~/Library/MobileDevice/"Provisioning Profiles"/profile.mobileprovision

      - name: Archive (signed, App Store distribution)
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          xcodebuild archive \
            -project AppDatHangIOS.xcodeproj \
            -scheme AppDatHangIOS \
            -configuration Release \
            -archivePath build/AppDatHangIOS.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution"

      - name: Export .ipa (App Store method)
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          cat > exportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>uk.denncoffee.appdathangios</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/AppDatHangIOS.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist exportOptions.plist

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          set -e
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$ASC_KEY_BASE64" | base64 --decode -o ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          IPA_PATH=$(find build/export -maxdepth 1 -iname "*.ipa" | head -1)
          xcrun altool --upload-app -f "$IPA_PATH" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
