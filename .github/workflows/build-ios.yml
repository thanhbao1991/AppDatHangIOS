name: Build unsigned iOS IPA

# Native SwiftUI (chuyển từ React Native/Expo, xem README) — build unsigned trên macOS runner của
# GitHub. Ký + cài thật làm ở máy Windows bằng Sideloadly, KHÔNG ký trong CI.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        # Bản nộp App Store: KHÔNG nhúng tài khoản test, giữ version dạng số (1.0.0) từ project.yml.
        # Mặc định false = bản sideload nội bộ như cũ.
        description: "Bản nộp App Store (không có nút Test nhanh, version dạng số)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests (iOS Simulator)
        # Không chỉ đích danh model ("iPhone 16") — GitHub âm thầm đổi simulator mặc định trên
        # image macos-15 theo thời gian (2026-09-08 từng gãy CI của AppQuanLyIOS vì "iPhone 16"
        # biến mất khỏi runner). Tự dò 1 simulator iPhone có sẵn (bất kỳ) trên máy.
        run: |
          set -e
          UDID=$(xcrun simctl list devices available \
            | grep -m1 -E 'iPhone [0-9]+ \(' \
            | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          if [ -z "$UDID" ]; then
            echo "Khong tim thay simulator iPhone nao kha dung"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Dung simulator: $UDID"
          xcodebuild test \
            -project AppDatHangIOS.xcodeproj \
            -scheme AppDatHangIOS \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO

  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Chỉ dev/test dùng — danh sách SĐT test (mật khẩu chung "123456") KHÔNG được commit vào repo
      # PUBLIC này (xem LoginView.swift, quickTestAccounts). Bí mật TEST_ACCOUNTS_JSON rỗng/chưa set
      # thì bỏ qua, hàng nút chọn nhanh ở màn Login tự ẩn, không ảnh hưởng build thật.
      # Bản nộp App Store (inputs.release) KHÔNG BAO GIỜ nhúng file này — nếu không, hàng nút "Test
      # nhanh" (đăng nhập thẳng bằng mật khẩu chung) sẽ lọt tới tay khách thật.
      - name: Write local test accounts (from secret, not committed)
        if: ${{ !inputs.release }}
        env:
          TEST_ACCOUNTS_JSON: ${{ secrets.TEST_ACCOUNTS_JSON }}
        run: |
          if [ -n "$TEST_ACCOUNTS_JSON" ]; then
            echo "$TEST_ACCOUNTS_JSON" > Sources/TestAccounts.local.json
          fi

      - name: Guard - release build must not contain test accounts
        if: ${{ inputs.release }}
        run: |
          if [ -f Sources/TestAccounts.local.json ]; then
            echo "TestAccounts.local.json ton tai trong ban release - dung lai"; exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Bản sideload: stamp gitSha+build time vào version để phân biệt bản đang cài (khớp cách
      # AppQuanLyIOS đang làm). Bản App Store: GIỮ CFBundleShortVersionString dạng số từ project.yml
      # (App Store Connect từ chối version chứa chữ), build number = số lần chạy workflow (luôn tăng).
      # gitSha vẫn ghi vào key riêng DennGitSha để tra ngược bản nào đang chạy.
      - name: Stamp build version into Info.plist
        run: |
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          /usr/libexec/PlistBuddy -c "Add :DennGitSha string ${SHORT_SHA}" Sources/Info.plist
          if [ "${{ inputs.release }}" = "true" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Sources/Info.plist
          else
            BUILD_TIME=$(date -u +%Y%m%d%H%M%S)
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${SHORT_SHA}" Sources/Info.plist
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_TIME}" Sources/Info.plist
          fi

      - name: Build unsigned .app
        run: |
          xcodebuild \
            -project AppDatHangIOS.xcodeproj \
            -scheme AppDatHangIOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package unsigned .ipa
        run: |
          set -e
          APP_PATH="build/Build/Products/Release-iphoneos/AppDatHangIOS.app"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r AppDatHangIOS-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: AppDatHangIOS-unsigned-ipa
          path: AppDatHangIOS-unsigned.ipa
