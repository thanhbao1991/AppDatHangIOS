name: AppDatHangIOS
options:
  bundleIdPrefix: com.denncoffee
  deploymentTarget:
    iOS: "16.0"
settings:
  DEVELOPMENT_TEAM: ""
targets:
  AppDatHangIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # Privacy manifest bắt buộc với App Store (app dùng UserDefaults — "required reason API").
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Đenn Coffee
        # App Store chỉ nhận dạng số "X.Y.Z" — tăng tay mỗi lần nộp bản mới lên store. CFBundleVersion
        # (build number) do CI tự đặt theo số lần chạy workflow, xem .github/workflows/build-ios.yml.
        CFBundleShortVersionString: "1.0.14"
        CFBundleVersion: "1"
        # App chỉ dùng HTTPS chuẩn của iOS — miễn khai báo xuất khẩu mã hoá, khỏi phải trả lời lại
        # câu hỏi này mỗi lần upload lên App Store Connect.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        NSLocationWhenInUseUsageDescription: Đenn Coffee cần vị trí của bạn để tính phí ship theo khoảng cách thật và hiển thị bản đồ giao hàng.
        NSPhotoLibraryAddUsageDescription: Đenn Coffee cần lưu ảnh để tải mã QR chuyển khoản về máy bạn.
        # Icon theo dịp lễ: icon chính luôn là icon quán; server bảo lúc nào đổi sang icon phụ nào (xem
        # AppIconSwitcher). Thêm dịp: tạo Assets.xcassets/AppIcon-<MA voucher>.appiconset + khai ở đây +
        # thêm MA vào AppIconSwitcher.maCoIcon — cần ra bản cập nhật, còn bật/tắt theo ngày thì không.
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
          CFBundleAlternateIcons:
            AppIcon-NOEL:
              CFBundleIconName: AppIcon-NOEL
            AppIcon-VALENTINE:
              CFBundleIconName: AppIcon-VALENTINE
            AppIcon-TETAL:
              CFBundleIconName: AppIcon-TETAL
            AppIcon-TETDUONG:
              CFBundleIconName: AppIcon-TETDUONG
            AppIcon-QTPHUNU:
              CFBundleIconName: AppIcon-QTPHUNU
            AppIcon-PHUNUVN:
              CFBundleIconName: AppIcon-PHUNUVN
            AppIcon-GIOTO:
              CFBundleIconName: AppIcon-GIOTO
            AppIcon-GIAIPHONG:
              CFBundleIconName: AppIcon-GIAIPHONG
            AppIcon-THIEUNHI:
              CFBundleIconName: AppIcon-THIEUNHI
            AppIcon-DOANNGO:
              CFBundleIconName: AppIcon-DOANNGO
            AppIcon-THUONGBINH:
              CFBundleIconName: AppIcon-THUONGBINH
            AppIcon-VULAN:
              CFBundleIconName: AppIcon-VULAN
            AppIcon-QUOCKHANH:
              CFBundleIconName: AppIcon-QUOCKHANH
            AppIcon-TRUNGTHU:
              CFBundleIconName: AppIcon-TRUNGTHU
            AppIcon-NHAGIAO:
              CFBundleIconName: AppIcon-NHAGIAO
            # Icon quán làm icon PHỤ: bản build có icon chính là dịp lễ (scripts/chon-icon-dip-le.sh) mà hết dịp thì
            # app đổi về đây (server bảo icon quán).
            AppIcon-QUAN:
              CFBundleIconName: AppIcon-QUAN
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.denncoffee.appdathang
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Bắt buộc để Xcode đóng gói CẢ các AppIcon-*.appiconset phụ (không chỉ AppIcon chính) vào
        # bản build — thiếu dòng này thì setAlternateIconName gọi đúng tên nhưng app KHÔNG có icon đó
        # trong bundle, đổi thất bại âm thầm.
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        # Tắt chained fixups (mặc định bật từ Xcode 15+) — các tool ký lại IPA kiểu sideload
        # (Sideloadly/AltServer) không parse được code signature theo định dạng mới này, báo lỗi
        # "Invalid file" ngay khi chưa kịp liên lạc mạng. Không ảnh hưởng gì khi cài qua TestFlight/
        # App Store thật, chỉ cần thiết cho luồng sideload free Apple ID.
        OTHER_LDFLAGS: -Wl,-no_fixup_chains
        CODE_SIGN_ENTITLEMENTS: AppDatHangIOS.entitlements
    scheme:
      testTargets:
        - AppDatHangIOSTests
  AppDatHangIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: AppDatHangIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.denncoffee.appdathang.tests
        SWIFT_VERSION: "5.0"
