name: AppDatHangIOS
options:
  bundleIdPrefix: uk.denncoffee
  deploymentTarget:
    iOS: "16.0"
settings:
  DEVELOPMENT_TEAM: ""
targets:
  AppDatHangIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Đenn Coffee
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        NSLocationWhenInUseUsageDescription: Đenn Coffee cần vị trí của bạn để tính phí ship theo khoảng cách thật và hiển thị bản đồ giao hàng.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.denncoffee.appdathangios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        # Tắt chained fixups (mặc định bật từ Xcode 15+) — các tool ký lại IPA kiểu sideload
        # (Sideloadly/AltServer) không parse được code signature theo định dạng mới này, báo lỗi
        # "Invalid file" ngay khi chưa kịp liên lạc mạng. Không ảnh hưởng gì khi cài qua TestFlight/
        # App Store thật, chỉ cần thiết cho luồng sideload free Apple ID.
        OTHER_LDFLAGS: -Wl,-no_fixup_chains
    scheme:
      testTargets:
        - AppDatHangIOSTests
  AppDatHangIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: AppDatHangIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.denncoffee.appdathangios.tests
        SWIFT_VERSION: "5.0"
